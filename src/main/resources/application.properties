# CONFIGURA\u00C7\u00D5ES B\u00C1SICAS
server.port=8080
server.servlet.context-path=/comercial

# BANCO DE DADOS (MYSQL)
spring.datasource.url=jdbc:mysql://localhost:3306/comercial_dev?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA/HIBERNATE (Configura\u00E7\u00F5es m\u00EDnimas necess\u00E1rias)
spring.jpa.hibernate.ddl-auto=update

# THYMELEAF (Configura\u00E7\u00E3o m\u00EDnima)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# RECURSOS EST\u00C1TICOS
spring.web.resources.static-locations=classpath:/static/

# LOGGING
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# EMAIL (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:noreply@unisenai.com}

