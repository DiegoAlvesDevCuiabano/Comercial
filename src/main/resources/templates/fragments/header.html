<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle ?: 'Sistema Comercial'}">Sistema Comercial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<header th:fragment="header" class="header">
  <div class="header-brand">
    <img th:src="@{/images/logo-unisenai.png}" alt="UniSENAI" class="header-logo-img">
    <div class="header-separator"></div>
    <div>
      <div class="header-title">Sistema Comercial</div>
      <div class="header-welcome">Bem-vindo, <span th:text="${userDetails.name}">Usuário</span></div>
    </div>
  </div>
  <div class="header-decorations">
    <img th:src="@{/images/icon-evento.png}" alt="" class="header-deco-icon">
    <img th:src="@{/images/icon-receita.png}" alt="" class="header-deco-icon">
  </div>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="btn btn-outline-light btn-sm">
      <i class="fas fa-sign-out-alt me-1"></i>Sair
    </button>
  </form>
</header>
</html>
