<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Eventos - Sistema Comercial</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="py-4">
    <div class="clientes-container animate__animated animate__fadeIn">
        <h2 class="mb-4">Eventos</h2>

        <div class="clientes-header">
            <h3 class="clientes-title">Lista de Eventos Cadastrados</h3>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#eventoModal"
                    onclick="limparFormulario()">
                <i class="fas fa-plus me-1"></i> Novo Evento
            </button>
        </div>

        <div class="search-box">
            <input type="text" class="form-control" placeholder="Pesquisar..." id="searchInput">
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>Título</th>
                    <th>Data</th>
                    <th>Hora Início</th>
                    <th>Hora Fim</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="evento : ${eventos}" class="animate__animated animate__fadeInUp">
                    <td th:text="${evento.titulo}">Título</td>
                    <td th:text="${evento.dataInicio != null && evento.dataFim != null
             ? #temporals.format(evento.dataInicio, 'dd/MM/yyyy') + ' - ' + #temporals.format(evento.dataFim, 'dd/MM/yyyy')
             : ''}">
                    </td>

                    <td th:text="${evento.horaInicio}">10:00</td>
                    <td th:text="${evento.horaFim}">12:00</td>
                    <td th:text="${#numbers.formatDecimal(evento.valorTotal, 1, 'POINT', 2, 'COMMA')}">0,00</td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-primary me-2"
                                th:onclick="'carregarEventoParaEdicao(' + ${evento.idEvento} + ')'"
                                data-bs-toggle="modal" data-bs-target="#eventoModal">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                        <form th:action="@{'/eventos/excluir/' + ${evento.idEvento}}" method="post"
                              style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Deseja realmente excluir este evento?')">
                                <i class="fas fa-trash-alt"></i> Excluir
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${eventos.size() == 0}">
                    <td colspan="6" class="text-center py-4">Nenhum Evento Encontrado</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="eventoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content animate__animated animate__fadeInDown">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Novo Evento</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form th:action="@{/eventos/salvar}" method="post" id="eventoForm">
                <div class="modal-body">
                    <input type="hidden" name="idEvento" id="eventoId">

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título *</label>
                                <input type="text" class="form-control" id="titulo" name="titulo" required>
                            </div>
                            <div class="mb-3">
                                <label for="dataInicio" class="form-label">Data de Início *</label>
                                <input type="date" class="form-control" id="dataInicio" name="dataInicio" required>

                                <label for="dataFim" class="form-label">Data de Fim *</label>
                                <input type="date" class="form-control" id="dataFim" name="dataFim" required>
                            </div>
                            <div class="mb-3">
                                <label for="horaInicio" class="form-label">Hora de Início *</label>
                                <input type="time" class="form-control" id="horaInicio" name="horaInicio" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="cliente" class="form-label">Cliente *</label>
                                <select class="form-select" id="cliente" name="cliente.id" required>
                                    <option value="">Selecione...</option>
                                    <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nome}">
                                        Cliente
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="local" class="form-label">Local *</label>
                                <select class="form-select" id="local" name="local.id" required>
                                    <option value="">Selecione...</option>
                                    <option th:each="l : ${locais}" th:value="${l.idLocal}" th:text="${l.nome}">Local
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="horaFim" class="form-label">Hora de Fim *</label>
                                <input type="time" class="form-control" id="horaFim" name="horaFim" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3 servicos-section p-3 rounded">
                        <h6 class="servicos-title mb-3">Serviços</h6>
                        <div class="d-flex mb-2">
                            <select class="form-select" id="servicoSelect">
                                <option value="">Selecione um serviço...</option>
                                <option th:each="s : ${servicos}" th:value="${s.idServico}"
                                        th:data-preco="${s.precoUnitario}"
                                        th:text="${s.nome + ' (R$ ' + #numbers.formatDecimal(s.precoUnitario,1,'POINT',2,'COMMA') + ')'}"></option>
                            </select>
                            <button type="button" class="btn btn-secondary ms-2" id="addServicoBtn">Adicionar</button>
                        </div>

                        <table id="servicosSelecionadosTable" class="table table-sm servicos-table">
                            <thead>
                            <tr>
                                <th>Serviço</th>
                                <th>Qtd</th>
                                <th>Preço Unit.</th>
                                <th>Total</th>
                                <th>Ações</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <div class="mb-3">
                        <label for="valorTotalBr" class="form-label">Valor Total</label>
                        <input type="text" class="form-control" id="valorTotalBr" readonly>
                    </div>
                    <div class="mb-3 row">
                        <div class="col-md-6">
                            <label for="descontoValor" class="form-label">Desconto (R$)</label>
                            <input type="number" step="0.01" class="form-control" id="descontoValor"
                                   name="descontoValor" value="0">
                        </div>
                        <div class="col-md-6">
                            <label for="descontoPercentualExibicao" class="form-label">% Desconto</label>
                            <input type="text" class="form-control" id="descontoPercentualExibicao" readonly>
                            <input type="hidden" name="descontoPercentual" id="descontoPercentual">
                        </div>

                    </div>

                    <input type="hidden" id="valorTotal" name="valorTotal">
                    <input type="hidden" name="servicosSelecionados" id="servicosSelecionadosHidden">

                    <div class="mb-3">
                        <label for="observacoes" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let servicosSelecionados = [];
    let servicosTableBody;
    let valorTotalInputBR;
    let valorTotalInputHidden;

    document.addEventListener('DOMContentLoaded', function () {
        servicosTableBody = document.querySelector('#servicosSelecionadosTable tbody');
        valorTotalInputBR = document.getElementById('valorTotalBr');
        valorTotalInputHidden = document.getElementById('valorTotal');

        const servicoSelect = document.getElementById('servicoSelect');
        const addServicoBtn = document.getElementById('addServicoBtn');
        const form = document.getElementById('eventoForm');

        addServicoBtn.addEventListener('click', () => {
            const selectedOption = servicoSelect.options[servicoSelect.selectedIndex];
            const servicoId = selectedOption.value;
            if (!servicoId) return;

            const preco = parseFloat(selectedOption.dataset.preco);
            const nome = selectedOption.text;

            if (servicosSelecionados.some(s => s.id == servicoId)) {
                alert('Serviço já adicionado!');
                return;
            }

            servicosSelecionados.push({id: servicoId, nome: nome, preco: preco, quantidade: 1});
            atualizarTabela();
        });

        form.addEventListener('submit', e => {
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;

            if (dataFim && dataInicio && dataFim < dataInicio) {
                e.preventDefault();
                alert('Data de fim não pode ser anterior à data de início.');
                return;
            }

            if (servicosSelecionados.length === 0) {
                e.preventDefault();
                alert('Selecione pelo menos um serviço.');
                return;
            }

            document.getElementById('servicosSelecionadosHidden').value =
                servicosSelecionados.map(s => s.id + ':' + s.quantidade).join(',');
        });

        window.limparFormulario = function () {
            document.getElementById('modalTitle').textContent = 'Novo Evento';
            form.reset();
            servicosSelecionados = [];
            atualizarTabela();
        };

        window.carregarEventoParaEdicao = function (id) {
            fetch('eventos/buscar/' + id)
                .then(res => res.ok ? res.json() : Promise.reject(res.statusText))
                .then(evento => {
                    limparFormulario();
                    document.getElementById('eventoId').value = evento.idEvento;
                    document.getElementById('titulo').value = evento.titulo;
                    document.getElementById('dataInicio').value = evento.dataInicio;
                    document.getElementById('dataFim').value = evento.dataFim;
                    document.getElementById('horaInicio').value = evento.horaInicio;
                    document.getElementById('horaFim').value = evento.horaFim;
                    document.getElementById('valorTotal').value = evento.valorTotal;
                    document.getElementById('observacoes').value = evento.observacoes;
                    document.getElementById('descontoValor').value = evento.descontoValor || 0;
                    document.getElementById('descontoPercentual').value = evento.descontoPercentual ? evento.descontoPercentual.toFixed(2) + " %" : "0 %";
                    if (evento.cliente) document.getElementById('cliente').value = evento.cliente.idCliente;
                    if (evento.local) document.getElementById('local').value = evento.local.idLocal;

                    if (evento.servicos && evento.servicos.length > 0) {
                        const servicosFormatados = evento.servicos.map(item => ({
                            servico: {
                                idServico: item.servico.idServico,
                                nome: item.servico.nome,
                                precoUnitario: item.servico.precoUnitario
                            },
                            quantidade: item.quantidade
                        }));
                        carregarServicosExistentes(servicosFormatados);
                    }

                    document.getElementById('modalTitle').textContent = 'Editar Evento';
                    new bootstrap.Modal(document.getElementById('eventoModal')).show();
                })
                .catch(err => {
                    alert('Erro ao carregar evento.');
                });
        };

        function carregarServicosExistentes(servicos) {
            servicosSelecionados = servicos.map(s => ({
                id: s.servico.idServico,
                nome: s.servico.nome,
                preco: s.servico.precoUnitario,
                quantidade: s.quantidade
            }));
            atualizarTabela();
        }

        const descontoValorInput = document.getElementById('descontoValor');

        descontoValorInput.addEventListener('input', atualizarTabela);

        // Event delegation para inputs de quantidade e botões de remover
        servicosTableBody.addEventListener('input', e => {
            if (e.target.classList.contains('quantidadeInput')) {
                const idx = parseInt(e.target.dataset.index);
                servicosSelecionados[idx].quantidade = parseInt(e.target.value) || 1;
                atualizarTabela();
            }
        });

        servicosTableBody.addEventListener('click', e => {
            if (e.target.classList.contains('removeBtn')) {
                const idx = parseInt(e.target.dataset.index);
                servicosSelecionados.splice(idx, 1);
                atualizarTabela();
            }
        });

        function atualizarTabela() {
            servicosTableBody.innerHTML = '';
            let totalBruto = 0;

            servicosSelecionados.forEach((s, index) => {
                const totalItem = s.preco * s.quantidade;
                totalBruto += totalItem;

                const row = document.createElement('tr');
                row.innerHTML = `
            <td>${s.nome}</td>
            <td><input type="number" min="1" value="${s.quantidade}" class="form-control form-control-sm quantidadeInput" data-index="${index}"></td>
            <td>R$ ${s.preco.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
            <td>R$ ${totalItem.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
            <td><button type="button" class="btn btn-sm btn-danger removeBtn" data-index="${index}">Remover</button></td>
        `;
                servicosTableBody.appendChild(row);
            });

            const desconto = parseFloat(descontoValorInput.value) || 0;
            const percentual = totalBruto > 0 ? (desconto / totalBruto) * 100 : 0;
            document.getElementById('descontoPercentualExibicao').value = percentual.toFixed(2) + " %";
            document.getElementById('descontoPercentual').value = percentual.toFixed(2);
            const totalComDesconto = Math.max(totalBruto - desconto, 0);
            valorTotalInputBR.value = totalComDesconto.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            valorTotalInputHidden.value = totalComDesconto.toFixed(2);
        }


        document.getElementById('eventoModal').addEventListener('hidden.bs.modal', () => {
            document.body.classList.remove('modal-open');
            document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
        });
    });
</script>

</body>
</html>
