<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Sistema Comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #EDF2F7; font-family: 'Calibri', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { background: white; border-radius: 14px; box-shadow: 0 4px 24px rgba(26,35,50,0.08); padding: 3rem; text-align: center; max-width: 500px; }
    </style>
</head>
<body>
    <div class="error-card">
        <div style="font-size: 4rem; margin-bottom: 16px; opacity: 0.3;">
            <i class="fas fa-exclamation-triangle" style="color: #E85D04;"></i>
        </div>
        <h2 style="color: #1A2332; font-weight: 700; margin-bottom: 8px;">Algo deu errado</h2>
        <p style="color: #64748B;" th:text="${error} ?: 'Ocorreu um erro inesperado. Por favor, tente novamente.'">Erro</p>
        <a href="/comercial/home" class="btn" style="background: #6366F1; color: white; border-radius: 10px; padding: 10px 24px; font-weight: 600; margin-top: 16px;">
            <i class="fas fa-home me-2"></i> Voltar ao Início
        </a>
    </div>
</body>
</html>
