<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Erro - Sistema Comercial</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="py-4">
    <div class="clientes-container animate__animated animate__fadeIn" style="max-width: 600px; text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 16px; opacity: 0.3;">
            <i class="fas fa-exclamation-triangle" style="color: var(--uni-orange);"></i>
        </div>
        <h2 style="color: var(--uni-navy); font-weight: 700; margin-bottom: 8px;">Algo deu errado</h2>
        <p class="text-muted mb-4" th:text="${error} ?: 'Ocorreu um erro inesperado. Por favor, tente novamente.'">Erro</p>
        <a th:href="@{/home}" class="btn btn-primary px-4">
            <i class="fas fa-home me-2"></i> Voltar ao Início
        </a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
