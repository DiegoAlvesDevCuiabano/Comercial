<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Relatórios - Sistema Comercial</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="py-4">
    <div class="clientes-container animate__animated animate__fadeIn">
        <div class="clientes-header">
            <h2 class="clientes-title">Relatórios</h2>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100 relatorio-card">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center mb-3">
                            <div style="width: 42px; height: 42px; background: rgba(99,102,241,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 14px;">
                                <i class="fas fa-calendar-alt" style="color: var(--uni-indigo); font-size: 1.2rem;"></i>
                            </div>
                            <h5 class="card-title mb-0" style="color: var(--uni-navy); font-weight: 700;">Relatório de Eventos</h5>
                        </div>
                        <p class="card-text text-muted">Visão geral e detalhamento de todos os eventos cadastrados no sistema.</p>
                        <a th:href="@{/relatorios/eventos}" class="btn btn-primary px-4" target="_blank">
                            <i class="fas fa-file-pdf me-2"></i> Gerar PDF
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 relatorio-card">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center mb-3">
                            <div style="width: 42px; height: 42px; background: rgba(99,102,241,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 14px;">
                                <i class="fas fa-users" style="color: var(--uni-indigo); font-size: 1.2rem;"></i>
                            </div>
                            <h5 class="card-title mb-0" style="color: var(--uni-navy); font-weight: 700;">Relatório de Cadastros</h5>
                        </div>
                        <p class="card-text text-muted">Listagem completa de Clientes, Serviços e Locais cadastrados.</p>
                        <a th:href="@{/relatorios/entidades}" class="btn btn-primary px-4" target="_blank">
                            <i class="fas fa-file-pdf me-2"></i> Gerar PDF
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
