<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>Relatórios - Sistema Comercial</title>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="py-4">
    <div class="clientes-container animate__animated animate__fadeIn">
        <div class="clientes-header">
            <h2 class="clientes-title">Relatórios</h2>
        </div>

        <style>
            .report-card { border-radius: 14px; box-shadow: 0 4px 20px rgba(26,35,50,0.08); overflow: hidden; border: none; }
            .report-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-right: 12px; }
            .report-btn { padding: 10px; background: var(--uni-orange); border: none; color: white; border-radius: 10px; font-weight: 600; width: 100%; display: block; text-align: center; text-decoration: none; transition: var(--uni-transition); }
            .report-btn:hover { background: var(--uni-orange-hover); color: white; transform: translateY(-1px); }
            .report-bar { height: 4px; background: linear-gradient(90deg, var(--uni-indigo), var(--uni-blue)); }
        </style>

        <!-- Eventos: full-width (tem mais filtros) -->
        <div class="card report-card mb-4">
            <div class="report-bar"></div>
            <div class="card-body p-4">
                <div class="d-flex align-items-start mb-3">
                    <div class="report-icon" style="background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(99,102,241,0.05));">
                        <i class="fas fa-calendar-check" style="color: var(--uni-indigo); font-size: 1.1rem;"></i>
                    </div>
                    <div>
                        <h5 class="mb-0" style="color: var(--uni-navy); font-weight: 700;">Relatório de Eventos</h5>
                        <small class="text-muted">Visão geral e detalhamento com filtros por período, cliente, local e status.</small>
                    </div>
                </div>
                <form th:action="@{/relatorios/eventos}" method="get" target="_blank">
                    <div class="row g-2 mb-3">
                        <div class="col-md-2">
                            <label class="form-label">Data Início</label>
                            <input type="date" name="dataInicio" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Data Fim</label>
                            <input type="date" name="dataFim" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cliente</label>
                            <select name="clienteId" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nome}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Local</label>
                            <select name="localId" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option th:each="l : ${locais}" th:value="${l.idLocal}" th:text="${l.nome}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option th:each="s : ${statusList}" th:value="${s}" th:text="${s.descricao}"></option>
                            </select>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="submit" class="report-btn" data-loading style="padding: 7px; font-size: 0.85rem;">
                                <i class="fas fa-file-pdf"></i> Gerar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Row de 3 cards iguais -->
        <div class="row g-4">
            <!-- Cadastros -->
            <div class="col-md-4">
                <div class="card report-card h-100">
                    <div class="report-bar"></div>
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex align-items-start mb-3">
                            <div class="report-icon" style="background: linear-gradient(135deg, rgba(232,93,4,0.12), rgba(232,93,4,0.04));">
                                <i class="fas fa-users" style="color: var(--uni-orange); font-size: 1.1rem;"></i>
                            </div>
                            <div>
                                <h6 class="mb-0" style="color: var(--uni-navy); font-weight: 700;">Cadastros</h6>
                                <small class="text-muted">Clientes, Serviços e Locais</small>
                            </div>
                        </div>
                        <p class="text-muted mb-3" style="font-size: 0.85rem;">Listagem completa de todos os cadastros do sistema.</p>
                        <div class="mt-auto">
                            <a th:href="@{/relatorios/entidades}" class="report-btn" target="_blank" style="font-size: 0.85rem;">
                                <i class="fas fa-file-pdf"></i> Gerar Relatório
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Público Estimado -->
            <div class="col-md-4">
                <div class="card report-card h-100">
                    <div class="report-bar"></div>
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex align-items-start mb-3">
                            <div class="report-icon" style="background: linear-gradient(135deg, rgba(66,133,244,0.15), rgba(66,133,244,0.05));">
                                <i class="fas fa-user-friends" style="color: var(--uni-blue); font-size: 1.1rem;"></i>
                            </div>
                            <div>
                                <h6 class="mb-0" style="color: var(--uni-navy); font-weight: 700;">Público Estimado</h6>
                                <small class="text-muted">Estimativa por evento</small>
                            </div>
                        </div>
                        <form th:action="@{/relatorios/publico}" method="get" target="_blank" class="d-flex flex-column flex-grow-1">
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label" style="font-size: 0.8rem;">Início</label>
                                    <input type="date" name="dataInicio" class="form-control form-control-sm">
                                </div>
                                <div class="col-6">
                                    <label class="form-label" style="font-size: 0.8rem;">Fim</label>
                                    <input type="date" name="dataFim" class="form-control form-control-sm">
                                </div>
                            </div>
                            <div class="mt-auto">
                                <button type="submit" class="report-btn" data-loading style="font-size: 0.85rem;">
                                    <i class="fas fa-file-pdf"></i> Gerar Relatório
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Horas Contratadas -->
            <div class="col-md-4">
                <div class="card report-card h-100">
                    <div class="report-bar"></div>
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex align-items-start mb-3">
                            <div class="report-icon" style="background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(99,102,241,0.05));">
                                <i class="fas fa-clock" style="color: var(--uni-indigo); font-size: 1.1rem;"></i>
                            </div>
                            <div>
                                <h6 class="mb-0" style="color: var(--uni-navy); font-weight: 700;">Horas Contratadas</h6>
                                <small class="text-muted">Cálculo automático</small>
                            </div>
                        </div>
                        <form th:action="@{/relatorios/horas}" method="get" target="_blank" class="d-flex flex-column flex-grow-1">
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label" style="font-size: 0.8rem;">Início</label>
                                    <input type="date" name="dataInicio" class="form-control form-control-sm">
                                </div>
                                <div class="col-6">
                                    <label class="form-label" style="font-size: 0.8rem;">Fim</label>
                                    <input type="date" name="dataFim" class="form-control form-control-sm">
                                </div>
                            </div>
                            <div class="mt-auto">
                                <button type="submit" class="report-btn" data-loading style="font-size: 0.85rem;">
                                    <i class="fas fa-file-pdf"></i> Gerar Relatório
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: toasts}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: toastScript}"></th:block>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
