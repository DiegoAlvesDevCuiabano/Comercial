<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Comercial</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --uni-blue: #4285F4;
            --uni-navy: #1A2332;
            --uni-indigo: #6366F1;
            --uni-bg: #EDF2F7;
            --uni-indigo-hover: #4F46E5;
        }

        body {
            background-color: var(--uni-bg);
            font-family: 'Calibri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
        }

        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(26, 35, 50, 0.12);
            overflow: hidden;
            background-color: #fff;
        }

        .login-header {
            background-color: var(--uni-navy);
            color: white;
            padding: 24px;
            text-align: center;
            border-bottom: 3px solid var(--uni-indigo);
        }

        .login-header h4 {
            margin: 0;
            font-weight: 700;
        }

        .login-body {
            padding: 30px;
        }

        .form-control:focus {
            border-color: var(--uni-indigo);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn-login {
            background-color: var(--uni-indigo);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: var(--uni-indigo-hover);
            transform: translateY(-1px);
        }

        .input-group-text {
            background-color: var(--uni-navy);
            color: white;
            border: none;
        }

        .footer-message {
            text-align: center;
            font-size: 0.85rem;
            color: #64748B;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img th:src="@{/images/logo-unisenai.png}" alt="UniSENAI" style="height: 42px; margin-bottom: 12px;">
            <h4>
                Sistema Comercial
            </h4>
        </div>

        <div class="login-body">

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i> Usuário ou senha inválidos!
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i> Você saiu do sistema com sucesso.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Digite seu usuário"
                                required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Digite sua senha"
                                required>
                    </div>
                </div>

                <button type="submit" class="btn btn-login">Entrar</button>
            </form>

            <p class="footer-message">
                Sistema de Controle Comercial<br>
                UniSENAI
            </p>
        </div>
    </div>
</div>
</body>
</html>
